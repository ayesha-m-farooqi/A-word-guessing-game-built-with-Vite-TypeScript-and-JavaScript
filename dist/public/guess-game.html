<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Guessing Game</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .game-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .info-box {
      flex: 1;
      min-width: 120px;
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .info-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .hint-container {
      background: #e8f4f8;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .hint-label {
      font-size: 12px;
      color: #667eea;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .hint-text {
      font-size: 16px;
      color: #333;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 12px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .letter-boxes {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 20px;
      min-height: 60px;
    }

    .letter-box {
      width: 50px;
      height: 50px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      background: white;
      transition: all 0.3s;
      cursor: text;
      padding: 0;
    }

    .letter-box:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .letter-box:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
      color: #999;
    }

    .letter-box.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .letter-box.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="text"]:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-reset {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #ddd;
    }

    .btn-reset:hover {
      background: #e8e8e8;
      border-color: #999;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }

    .game-over {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    .game-over.show {
      display: block;
    }

    .game-over-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .game-over-word {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 15px;
    }

    @media (max-width: 480px) {
      .game-container {
        padding: 25px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .game-info {
        flex-direction: column;
      }

      .info-box {
        width: 100%;
      }

      .letter-box {
        width: 45px;
        height: 45px;
        font-size: 20px;
      }

      button {
        padding: 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🎮 Word Guessing Game</h1>

    <div class="game-info">
      <div class="info-box">
        <div class="info-label">Remaining Guesses</div>
        <div class="info-value" id="guessesLeft">6</div>
      </div>
      <div class="info-box">
        <div class="info-label">Score</div>
        <div class="info-value" id="score">0</div>
      </div>
    </div>

    <div class="hint-container">
      <div class="hint-label">💡 Hint</div>
      <div class="hint-text" id="hintText">Loading hint...</div>
    </div>

    <form id="guessForm">
      <div class="input-group">
        <p>Enter letters in the boxes below:</p>
        <div class="letter-boxes" id="letterBoxes"></div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-submit" id="submitBtn">Submit Guess</button>
        <button type="button" class="btn-reset" id="resetBtn">New Game</button>
      </div>
    </form>

    <div class="message" id="message"></div>
    <div class="game-over" id="gameOver">
      <div class="game-over-title" id="gameOverTitle"></div>
      <div class="game-over-word" id="gameOverWord"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
